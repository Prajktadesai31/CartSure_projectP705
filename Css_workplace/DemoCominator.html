<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div p
         {
            border : 2px solid red;  
            width: 200px;
            height: 200px;
            padding:20px; 
            margin: 30px;
                
         }

         ul > li{
               list-style: square;
         }

         h3~p
         {
            font-family: 30px;
            color: blue;
         }
         h2+p
         {
            color:blueviolet;
            font-weight: bold;

         }
    </style>
</head>

<body>

    <div>This is a division
        <p>para 1 from div</p>
    </div>
    
    <ul>
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
    </ul>

    <h3>heading 3 elment is sibling</h3>
    <p>para sibling</p>

    <h2>heading 2 is preceded by para </h2>
    <p>para--targeted element</p>
</body>
</html>
